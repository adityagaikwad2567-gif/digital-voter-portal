{% extends "base.html" %}
{% block title %}Add Polling Station — Admin{% endblock %}
{% block content %}
<div class="container py-4">
    <h2><i class="bi bi-building"></i> Add Polling Station</h2>
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Station Name *</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Address *</label>
                        <input type="text" name="address" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">State</label>
                        <input type="text" name="state" class="form-control" value="Maharashtra">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">District</label>
                        <input type="text" name="district" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Constituency</label>
                        <input type="text" name="constituency" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Booth Number</label>
                        <input type="text" name="booth_number" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Capacity</label>
                        <input type="number" name="capacity" class="form-control" value="500">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Accessibility</label>
                        <select name="accessibility" class="form-select">
                            <option value="1">Wheelchair Accessible</option>
                            <option value="0">Not Accessible</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Facilities</label>
                        <input type="text" name="facilities" class="form-control" placeholder="e.g., Drinking Water, Toilet, Help Desk">
                        <small class="text-muted">Comma-separated list</small>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Add Station</button>
                    <a href="{{ url_for('admin.polling_stations_list') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
