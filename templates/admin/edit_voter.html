{% extends "base.html" %}
{% block title %}Edit Voter — Admin{% endblock %}
{% block content %}
<div class="container py-4">
    <h2><i class="bi bi-pencil"></i> Edit Voter</h2>
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ voter.name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ voter.email }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mobile</label>
                        <input type="text" name="mobile" class="form-control" value="{{ voter.mobile or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="active" {{ 'selected' if voter.status == 'active' }}>Active</option>
                            <option value="inactive" {{ 'selected' if voter.status == 'inactive' }}>Inactive</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" name="dob" class="form-control" value="{{ voter.dob|format_date('%Y-%m-%d') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Gender</label>
                        <select name="gender" class="form-select">
                            <option value="">Select</option>
                            <option value="Male" {{ 'selected' if voter.gender == 'Male' }}>Male</option>
                            <option value="Female" {{ 'selected' if voter.gender == 'Female' }}>Female</option>
                            <option value="Other" {{ 'selected' if voter.gender == 'Other' }}>Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="2">{{ voter.address or '' }}</textarea>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">State</label>
                        <input type="text" name="state" class="form-control" value="{{ voter.state or '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">District</label>
                        <input type="text" name="district" class="form-control" value="{{ voter.district or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Constituency</label>
                        <input type="text" name="constituency" class="form-control" value="{{ voter.constituency or '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Pincode</label>
                        <input type="text" name="pincode" class="form-control" value="{{ voter.pincode or '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select">
                            <option value="voter" {{ 'selected' if voter.role == 'voter' }}>Voter</option>
                            <option value="admin" {{ 'selected' if voter.role == 'admin' }}>Admin</option>
                            <option value="election_official" {{ 'selected' if voter.role == 'election_official' }}>Election Official</option>
                        </select>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Save Changes</button>
                    <a href="{{ url_for('admin.view_voter', user_id=voter.id) }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
