{% extends "base.html" %}
{% block title %}Create Election — Admin{% endblock %}
{% block content %}
<div class="container py-4">
    <h2><i class="bi bi-plus-circle"></i> Create New Election</h2>
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label">Election Name *</label>
                        <input type="text" name="name" class="form-control" required placeholder="e.g., BCA Student Council Election 2026">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Election Type *</label>
                        <select name="election_type" class="form-select" required>
                            <option value="Student Council">Student Council</option>
                            <option value="Class Representative">Class Representative</option>
                            <option value="Club Election">Club Election</option>
                            <option value="Departmental">Departmental</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Constituency</label>
                        <input type="text" name="constituency" class="form-control" placeholder="Leave blank for all">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Describe the election purpose..."></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Start Date & Time *</label>
                        <input type="datetime-local" name="start_time" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">End Date & Time *</label>
                        <input type="datetime-local" name="end_time" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Initial Status</label>
                        <select name="status" class="form-select">
                            <option value="Draft">Draft</option>
                            <option value="Upcoming">Upcoming</option>
                        </select>
                        <small class="text-muted">Use "Draft" to save without publishing, "Upcoming" to announce.</small>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Create Election</button>
                    <a href="{{ url_for('admin.elections_list') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
