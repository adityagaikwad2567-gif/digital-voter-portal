{% extends "base.html" %}
{% block title %}New Registration — Digital Voter Services{% endblock %}
{% block content %}
<div class="page-header">
    <div class="container">
        <h2><i class="bi bi-person-plus"></i> New Voter Registration — Academic Demonstration</h2>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('main.home') }}">Home</a></li>
                <li class="breadcrumb-item active">New Registration</li>
            </ol>
        </nav>
    </div>
</div>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Progress Steps -->
            <div class="d-flex justify-content-between mb-4">
                <div class="text-center flex-fill">
                    <div class="rounded-circle d-inline-flex align-items-center justify-content-center" style="width:40px;height:40px;background:var(--primary);color:#fff;font-weight:700;">1</div>
                    <div class="small mt-1 fw-bold">Personal Info</div>
                </div>
                <div class="text-center flex-fill"><div class="rounded-circle d-inline-flex align-items-center justify-content-center" style="width:40px;height:40px;background:#e2e3e5;color:#6c757d;font-weight:700;">2</div><div class="small mt-1 text-muted">Contact</div></div>
                <div class="text-center flex-fill"><div class="rounded-circle d-inline-flex align-items-center justify-content-center" style="width:40px;height:40px;background:#e2e3e5;color:#6c757d;font-weight:700;">3</div><div class="small mt-1 text-muted">Address</div></div>
                <div class="text-center flex-fill"><div class="rounded-circle d-inline-flex align-items-center justify-content-center" style="width:40px;height:40px;background:#e2e3e5;color:#6c757d;font-weight:700;">4</div><div class="small mt-1 text-muted">Submit</div></div>
            </div>

            <div class="form-card">
                <h5 class="mb-4" style="color: var(--primary);"><i class="bi bi-person-badge"></i> Step 1: Personal Information</h5>
                <form method="POST" class="step-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="step" value="1">
                    
                    <div class="mb-3">
                        <label for="full_name" class="form-label">Full Name *</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" required placeholder="Enter your full name as per documents" minlength="2">
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="dob" class="form-label">Date of Birth *</label>
                            <input type="date" class="form-control" id="dob" name="dob" required max="2008-01-01">
                        </div>
                        <div class="col-md-6">
                            <label for="gender" class="form-label">Gender *</label>
                            <select class="form-select" id="gender" name="gender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary-custom">
                        <i class="bi bi-arrow-right"></i> Next: Contact Information
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
