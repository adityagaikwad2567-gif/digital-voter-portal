{% extends "base.html" %}
{% block title %}Registration Step 2 — Digital Voter Services{% endblock %}
{% block content %}
<div class="page-header">
    <div class="container">
        <h2><i class="bi bi-person-plus"></i> New Voter Registration — Step 2</h2>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('main.home') }}">Home</a></li>
                <li class="breadcrumb-item active">Registration Step 2</li>
            </ol>
        </nav>
    </div>
</div>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between mb-4">
                <div class="text-center flex-fill"><div class="rounded-circle d-inline-flex align-items-center justify-content-center" style="width:40px;height:40px;background:#28a745;color:#fff;font-weight:700;"><i class="bi bi-check"></i></div><div class="small mt-1 text-muted">Personal Info</div></div>
                <div class="text-center flex-fill"><div class="rounded-circle d-inline-flex align-items-center justify-content-center" style="width:40px;height:40px;background:var(--primary);color:#fff;font-weight:700;">2</div><div class="small mt-1 fw-bold">Contact</div></div>
                <div class="text-center flex-fill"><div class="rounded-circle d-inline-flex align-items-center justify-content-center" style="width:40px;height:40px;background:#e2e3e5;color:#6c757d;font-weight:700;">3</div><div class="small mt-1 text-muted">Address</div></div>
                <div class="text-center flex-fill"><div class="rounded-circle d-inline-flex align-items-center justify-content-center" style="width:40px;height:40px;background:#e2e3e5;color:#6c757d;font-weight:700;">4</div><div class="small mt-1 text-muted">Submit</div></div>
            </div>
            <div class="form-card">
                <h5 class="mb-4" style="color: var(--primary);"><i class="bi bi-telephone"></i> Step 2: Contact Information</h5>
                <form method="POST" class="step-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="step" value="2">
                    <input type="hidden" name="full_name" value="{{ data.full_name|default('') }}">
                    <input type="hidden" name="dob" value="{{ data.dob|default('') }}">
                    <input type="hidden" name="gender" value="{{ data.gender|default('') }}">
                    <div class="mb-3">
                        <label for="mobile" class="form-label">Mobile Number *</label>
                        <input type="tel" class="form-control" id="mobile" name="mobile" required pattern="[0-9]{10,}" placeholder="10-digit mobile number">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address *</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="your@email.com">
                    </div>
                    <div class="d-flex gap-2">
                        <a href="{{ url_for('voter.new_registration') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a>
                        <button type="submit" class="btn btn-primary-custom"><i class="bi bi-arrow-right"></i> Next: Address</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
