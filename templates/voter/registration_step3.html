{% extends "base.html" %}
{% block title %}Registration Step 3 — Digital Voter Services{% endblock %}
{% block content %}
<div class="page-header">
    <div class="container">
        <h2><i class="bi bi-person-plus"></i> New Voter Registration — Step 3</h2>
    </div>
</div>
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between mb-4">
                <div class="text-center flex-fill"><div class="rounded-circle d-inline-flex align-items-center justify-content-center" style="width:40px;height:40px;background:#28a745;color:#fff;font-weight:700;"><i class="bi bi-check"></i></div><div class="small mt-1 text-muted">Personal Info</div></div>
                <div class="text-center flex-fill"><div class="rounded-circle d-inline-flex align-items-center justify-content-center" style="width:40px;height:40px;background:#28a745;color:#fff;font-weight:700;"><i class="bi bi-check"></i></div><div class="small mt-1 text-muted">Contact</div></div>
                <div class="text-center flex-fill"><div class="rounded-circle d-inline-flex align-items-center justify-content-center" style="width:40px;height:40px;background:var(--primary);color:#fff;font-weight:700;">3</div><div class="small mt-1 fw-bold">Address</div></div>
                <div class="text-center flex-fill"><div class="rounded-circle d-inline-flex align-items-center justify-content-center" style="width:40px;height:40px;background:#e2e3e5;color:#6c757d;font-weight:700;">4</div><div class="small mt-1 text-muted">Submit</div></div>
            </div>
            <div class="form-card">
                <h5 class="mb-4" style="color: var(--primary);"><i class="bi bi-geo-alt"></i> Step 3: Address Details</h5>
                <form method="POST" class="step-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="step" value="3">
                    <input type="hidden" name="full_name" value="{{ data.full_name|default('') }}">
                    <input type="hidden" name="dob" value="{{ data.dob|default('') }}">
                    <input type="hidden" name="gender" value="{{ data.gender|default('') }}">
                    <input type="hidden" name="mobile" value="{{ data.mobile|default('') }}">
                    <input type="hidden" name="email" value="{{ data.email|default('') }}">
                    <div class="mb-3">
                        <label for="address" class="form-label">Full Address *</label>
                        <textarea class="form-control" id="address" name="address" rows="3" required placeholder="House/Flat No., Street, Area"></textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="state" class="form-label">State *</label>
                            <select class="form-select" id="state" name="state" required>
                                <option value="">Select State</option>
                                <option value="Maharashtra">Maharashtra</option>
                                <option value="Karnataka">Karnataka</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Gujarat">Gujarat</option>
                                <option value="Rajasthan">Rajasthan</option>
                                <option value="Uttar Pradesh">Uttar Pradesh</option>
                                <option value="West Bengal">West Bengal</option>
                                <option value="Tamil Nadu">Tamil Nadu</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="district" class="form-label">District *</label>
                            <input type="text" class="form-control" id="district" name="district" required placeholder="District name">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="constituency" class="form-label">Assembly Constituency *</label>
                            <input type="text" class="form-control" id="constituency" name="constituency" required placeholder="Constituency name">
                        </div>
                        <div class="col-md-6">
                            <label for="pincode" class="form-label">Pincode *</label>
                            <input type="text" class="form-control" id="pincode" name="pincode" required pattern="[0-9]{6}" placeholder="6-digit pincode">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="{{ url_for('voter.new_registration') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a>
                        <button type="submit" class="btn btn-primary-custom"><i class="bi bi-arrow-right"></i> Next: Review & Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
